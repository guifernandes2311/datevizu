<style>
:root{--b:#0F3B82;--bt:#2563EB;--bg:#F5F7FB;--c:#fff;--soft:#EDF1FA;--tx:#1F2937;--m:#64748b;--ln:#E5EAF2;--y:#FBBF24;--yb:#FEF3D6;--yt:#7A4E00;--gr:#137a3a;--grb:#e3f6ea;--rt:#b42318;--rb:#fee9e7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--b:#3b6cf0;--bt:#7ea2ff;--bg:#0b1220;--c:#121b30;--soft:#1a2745;--tx:#eef2fb;--m:#a3aecb;--ln:#25324f;--yb:#3a2f0d;--yt:#ffd36b;--gr:#6ee7a0;--grb:#12301f;--rt:#ff9b92;--rb:#3a1614}}
:root[data-theme=dark]{--b:#3b6cf0;--bt:#7ea2ff;--bg:#0b1220;--c:#121b30;--soft:#1a2745;--tx:#eef2fb;--m:#a3aecb;--ln:#25324f;--yb:#3a2f0d;--yt:#ffd36b;--gr:#6ee7a0;--grb:#12301f;--rt:#ff9b92;--rb:#3a1614}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:16px/1.55 "Plus Jakarta Sans",Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0 0 .4em;line-height:1.15;letter-spacing:-.02em;font-weight:800}h1{font-size:clamp(2rem,6vw,3.3rem);line-height:1.08}h1 em{font-style:normal;color:var(--b);background:linear-gradient(transparent 68%,rgba(255,194,26,.55) 68%)}h2{font-size:1.45rem}h3{font-size:1.1rem}
h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--m);margin:20px 0 8px;font-weight:700}p{margin:.35em 0}.m{color:var(--m);font-size:.9rem}a{color:var(--bt);cursor:pointer;font-weight:600}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px}main.wrap{padding-top:28px;padding-bottom:48px}
.card{background:var(--c);border:1px solid var(--ln);border-radius:22px;padding:22px;box-shadow:0 2px 10px rgba(15,59,130,.05)}
.btn{border:0;border-radius:13px;padding:11px 20px;font:inherit;font-weight:700;background:var(--b);color:#fff;cursor:pointer;transition:filter .15s,transform .1s,box-shadow .15s;box-shadow:0 2px 8px rgba(15,59,130,.18)}.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.98)}.btn.y{background:var(--y);color:#1a1a1a;box-shadow:0 2px 8px rgba(251,191,36,.3)}.btn.g{background:var(--soft);color:var(--b);box-shadow:none}.btn.r{background:var(--rb);color:var(--rt);box-shadow:none}.btn.s{padding:7px 14px;font-size:.85rem}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:13px;font:inherit;background:var(--c);color:var(--tx);margin:4px 0 14px}input:focus,textarea:focus,select:focus{outline:0;border-color:var(--b);box-shadow:0 0 0 3px rgba(37,99,235,.2)}label{font-size:.85rem;font-weight:650}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.sb{justify-content:space-between}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:20px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.ag{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:20px;align-items:start}
@media(max-width:820px){.g2,.g3,.ag{grid-template-columns:1fr}}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--c);border-bottom:1px solid var(--ln);z-index:5}
.logo{font-weight:800;color:var(--b);font-size:1.4rem;cursor:pointer;letter-spacing:-.03em}.logo b{color:var(--bt)}
nav{display:flex;gap:4px;overflow-x:auto}nav a{padding:8px 14px;border-radius:10px;white-space:nowrap;font-weight:600;color:var(--m)}nav a:hover{color:var(--tx)}nav a.on{background:var(--soft);color:var(--b);box-shadow:inset 0 -3px 0 var(--y)}
.hero{background:linear-gradient(180deg,var(--soft),var(--bg));padding:40px 0 12px}.tag{background:var(--yb);color:var(--yt);padding:5px 14px;border-radius:99px;font-size:.8rem;font-weight:700}
.ic{width:46px;height:46px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:1.35rem;margin-bottom:14px}
.badge{background:var(--soft);color:var(--bt);padding:2px 10px;border-radius:99px;font-size:.75rem;font-weight:700}.alt{background:var(--y);color:#1a1a1a;padding:2px 10px;border-radius:99px;font-size:.72rem;font-weight:800;vertical-align:middle}.alt.nw{background:var(--b);color:#fff}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal span{font-size:.75rem;color:var(--m);font-weight:700;padding-bottom:4px}
.day{aspect-ratio:1;border:0;border-radius:12px;background:transparent;color:var(--tx);font:inherit;cursor:pointer;position:relative}.day:hover{background:var(--soft)}.day.has{background:var(--yb);font-weight:700}.day.has::after{content:"";position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#f5a300}.day.today{outline:2px solid var(--b)}.day.sel{background:var(--b);color:#fff;box-shadow:0 4px 12px rgba(15,59,130,.35)}.day.sel::after{background:#fff}
.evi{display:flex;gap:10px;align-items:center;padding:13px 15px;border:1px solid var(--ln);border-left:4px solid var(--y);border-radius:15px;cursor:pointer;background:var(--c);transition:background .12s,border-color .12s}.evi:hover,.evi.sel{border-color:var(--b);border-left-color:var(--b);background:var(--soft)}.evi i{font-style:normal;background:var(--yb);color:var(--yt);border-radius:8px;padding:2px 8px;font-weight:700;font-size:.85rem}
.note{background:var(--yb);border-left:4px solid var(--y);border-radius:10px;padding:10px 14px}.hl{background:var(--yb);outline:2px solid var(--y);border-radius:8px;padding:4px 8px}
.bar{height:8px;background:var(--soft);border-radius:9px;overflow:hidden;margin:8px 0 10px}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--bt));border-radius:9px}
.chip{display:inline-block;background:var(--grb);color:var(--gr);border-radius:99px;padding:3px 11px;margin:2px;font-size:.8rem;font-weight:600}.chip.n{background:var(--yb);color:var(--yt)}
.q{border-top:1px solid var(--ln);padding:12px 0}.ans{background:var(--soft);border-left:4px solid var(--b);border-radius:10px;padding:8px 12px;margin-top:6px}
.bell{position:relative;background:var(--soft);border:0;border-radius:50%;width:40px;height:40px;cursor:pointer;font-size:1.1rem}.bell b{position:absolute;top:-4px;right:-4px;background:var(--y);color:#111;border-radius:99px;font-size:.7rem;padding:1px 6px;border:2px solid var(--c)}
.pop{position:absolute;right:12px;top:100%;width:min(360px,92vw);max-height:70vh;overflow:auto;z-index:9;box-shadow:0 12px 32px rgba(15,23,42,.18)}.ni{padding:10px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--ln)}.ni:hover{background:var(--soft)}.ni.u{background:var(--yb)}
.mod{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.mod .card{width:min(520px,100%);max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0F3B82;color:#fff;padding:11px 20px;border-radius:13px;z-index:30;max-width:92vw;box-shadow:0 10px 28px rgba(15,23,42,.3)}
.lg{height:46px;width:auto;display:block}@media(max-width:520px){.lg{height:38px}}@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .lg{background:#fff;border-radius:12px;padding:4px 10px}}:root[data-theme=dark] .lg{background:#fff;border-radius:12px;padding:4px 10px}

out(){D.s=null;S.p='land';sv();R()},
reset_demo(){if(confirm('Restaurar os dados de demonstração? Suas alterações serão perdidas.')){D=seed();S.p='land';sv();R()}},
create(){const n=$('#an').value.trim();if(!n)return T('Dê um nome à agenda');if(D.ags.some(a=>a.o==D.s))return T('Você já criou uma agenda');const a={id:id(),name:n,desc:'',code:code(),o:D.s,m:{[D.s]:'a'},ev:[]};D.ags.push(a);S.ag=a.id;S.ev=null;S.p='ppl';sv();R();T('Agenda criada! Compartilhe o código '+a.code)},
join(){const c=$('#cd').value.trim().toUpperCase(),a=D.ags.find(x=>x.code==c);if(!a)return T('Código não encontrado');if(D.s in a.m)return T('Você já participa desta agenda');a.m[D.s]='p';notify(a,D.s,UN(D.s)+' entrou na agenda "'+a.name+'"',null,adminsOf(a));S.ag=a.id;S.ev=null;S.p='cal';sv();R();T('Você entrou em '+a.name)},
open_ag(i){S.ag=i;S.ev=null;S.p='cal';S.day=iso(new Date());S.m=new Date();R()},
day(k){S.day=k;S.ev=null;R()},mo(n){S.m=new Date(S.m.getFullYear(),S.m.getMonth()+n,1);R()},
open(i){const e=cur().ev.find(x=>x.id==i);if(S.ev!=i)S.since=e.views[D.s]||0;S.ev=i;e.views[D.s]=now();D.n.forEach(n=>{if(n.u==D.s&&n.ev==i)n.r=1});sv();R()},
ev_form(i){S.mod={id:i};R()},close(){S.mod=null;R()},
saveev(){const a=cur(),t=$('#m1').value.trim(),d=$('#m2').value.trim(),h=$('#m3').value.trim(),he=$('#m3b').value.trim(),ds=$('#m4').value.trim(),nt=$('#m5').value.trim();if(!t||!d||!h||!he)return T('Preencha nome, data, horário de início e horário final');if(he<=h)return T('O horário final deve ser depois do horário de início');let e;
 if(S.mod.id){e=a.ev.find(x=>x.id==S.mod.id);const f=[];if(t!=e.title)f.push('título');if(d!=e.date||h!=e.time||he!=e.endTime)f.push('data/horário');if(ds!=e.desc)f.push('descrição');if(nt!=e.note)f.push('observação');
  Object.assign(e,{title:t,date:d,time:h,endTime:he,desc:ds,note:nt});if(f.length){e.rev.push({ts:now(),by:D.s,f});notify(a,D.s,'Evento alterado: '+t+' ('+f.join(', ')+')',e.id)}}
 else{e={id:id(),title:t,date:d,time:h,endTime:he,desc:ds,note:nt,views:{},qs:[],rev:[]};a.ev.push(e);notify(a,D.s,'Novo evento: '+t,e.id)}
 e.views[D.s]=now();S.since=now()+1;S.ev=e.id;S.day=d;S.m=new Date(d+'T12:00');S.mod=null;sv();R();T('Evento salvo')},
del(i){if(!confirm('Excluir este evento?'))return;const a=cur();a.ev=a.ev.filter(e=>e.id!=i);D.n=D.n.filter(n=>n.ev!=i);S.ev=null;sv();R()},
ask(i){const t=$('#qt').value.trim();if(!t)return T('Escreva sua pergunta');const a=cur(),e=a.ev.find(x=>x.id==i);e.qs.push({id:id(),u:D.s,text:t,ts:now()});notify(a,D.s,UN(D.s)+' perguntou em "'+e.title+'"',i,adminsOf(a));sv();R();T('Pergunta enviada aos administradores')},
ans(i,q){const t=$('#r'+q).value.trim();if(!t)return T('Escreva a resposta');const a=cur(),e=a.ev.find(x=>x.id==i),k=e.qs.find(x=>x.id==q);k.a={by:D.s,text:t,ts:now()};notify(a,D.s,UN(D.s)+' respondeu sua pergunta em "'+e.title+'"',i,[k.u]);sv();R()},
pop(){S.pop=!S.pop;R()},readAll(){D.n.forEach(n=>{if(n.u==D.s)n.r=1});sv();R()},
nt(i){const n=D.n.find(x=>x.id==i);n.r=1;S.pop=0;if(D.ags.some(a=>a.id==n.ag&&D.s in a.m)){S.ag=n.ag;const e=n.ev&&cur().ev.find(x=>x.id==n.ev);if(e){S.p='cal';S.day=e.date;S.m=new Date(e.date+'T12:00');S.ev=null;return A.open(e.id)}S.p='ppl'}sv();R()},
role(u){const a=cur();a.m[u]=a.m[u]=='a'?'p':'a';notify(a,D.s,'Sua função em "'+a.name+'" agora é '+(a.m[u]=='a'?'Administrador':'Participante'),null,[u]);sv();R()},
rm(u){if(!confirm('Remover '+UN(u)+' da agenda?'))return;delete cur().m[u];sv();R()},
leave(i){if(!confirm('Sair desta agenda?'))return;delete D.ags.find(x=>x.id==i).m[D.s];if(S.ag==i)S.ag=(myAgs()[0]||{}).id;S.p='mine';sv();R()},
delag(){if(!confirm('Excluir a agenda e todos os eventos? Não dá para desfazer.'))return;const i=S.ag;D.ags=D.ags.filter(a=>a.id!=i);D.n=D.n.filter(n=>n.ag!=i);S.ag=(myAgs()[0]||{}).id;S.p='mine';sv();R()},
savecfg(){const a=cur();a.name=$('#cn').value.trim()||a.name;a.desc=$('#cds').value.trim();sv();R();T('Configurações salvas')},
newcode(){cur().code=code();sv();R();T('Novo código gerado; o anterior deixou de funcionar')},
copy(c){navigator.clipboard?.writeText(c).then(()=>T('Código copiado'),()=>T('Código: '+c))},
saveprof(){const u=me(),n=$('#pn').value.trim(),m=$('#pe').value.trim().toLowerCase(),p=$('#pp').value;if(!n||!m)return T('Preencha nome e e-mail');if(D.users.some(x=>x.id!=u.id&&x.email==m))return T('E-mail já em uso');if(p&&p.length<6)return T('A senha precisa de 6+ caracteres');u.name=n;u.email=m;if(p)u.pw=H(p);sv();R();T('Perfil atualizado')}};
R();
</script></body></html>
